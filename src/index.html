<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de la Pràctica</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body id="bodyID">

<div class="container">
<!--    Generació i ordenar-->
    <div class="controls">
        <div class="inici">

            <div class="titol">
                <h1>Títol</h1>
            </div>

            <div class="generador">
                <div class="card2">
                    <div class="card3" style="background:#66A3BFFF; padding:5px">
                        <h1 style="color:#F2EFE7">Generació de tamagochis</h1>
                    </div>

                    <div class="enunciats">
                    <div class="field">
                        <label for="iNom">Nombre:</label>
                        <input type="text" id="iNom" placeholder="Escribe el nombre de tu tamagochi">
                        <errorNom id="errorNom"></errorNom>
                    </div>

                    <div class="field">
                        <label for="iAparença">Apariencia:</label>
                        <select id="iAparença">
                            <option value="Opció 1">Hachi</option>
                            <option value="Opció 2">Nagi</option>
                            <option value="Opció 3">Cinnamonroll</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="iEdat">Edad:</label>
                        <input type="number" id="iEdat" value="0">
                    </div>

                    <div class="field">
                        <label for="iPes">Peso (kg
                            ):</label>
                        <input type="number" id="iPes" value="0">
                    </div>

                    <div class="field-checkbox" style="margin:0">
                        <label>
                            <input type="checkbox" id="iCondicions">
                            Acepta términos y condiciones para ser legal (ninguno)
                        </label>
                    </div>
                    </div>

                    <button style="margin-top:20px" id="btnAfegir">Afegir a la Llista</button>
                </div>
            </div>
        </div>

        <div class="organitzador">

            <div class="card1">
                <div class="card3">
                    <h1 style="color:#3368A0">Eines d'organització</h1>
                </div>

                <div style="background: #c8dfdb; border-radius: 15px; margin-top:25px; padding: 20px;">

                    <p style="margin-top:0" >Temes:</p>

                    <div class="field">
                        <button onclick="canviTema()">Cambiar Tema</button>
                    </div>

                    <!--Botons per ordenar-->
                    <p>Ordenar:</p>

                    <button onclick="ordenarNom()">Ordenar por nombre en orden alfabético</button>
                    <div style="padding:0" class="enunciats">

                        <div style="gap:10px" class="field">
                            <button onclick="ordenarEdatMajMen()">Ordenar por edad mayor a menor</button>
                            <button onclick="ordenarPesMajMen()">Ordenar por peso mayor a menor</button>
                            <button onclick="ordenarFelicitatMajMen()">Ordenar por felicidad mayor a menor</button>
                        </div>
                        <div style="gap:10px" class="field">
                            <button onclick="ordenarEdatMenMaj()">Ordenar por edad menor a mayor</button>
                            <button onclick="ordenarPesMenMaj()">Ordenar por peso menor a mayor</button>
                            <button onclick="ordenarFelicitatMenMaj()">Ordenar por felicidad menor a mayor</button>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="tamagochis" id="contenidorAnimals">
        <div class="t1">
            <div class="info">
                <div>
                    <h1 id="nom"></h1>
                    <h2 id="aparença"></h2>
                    <h2 id="edat"></h2>
                    <h2 id="pes"></h2>
                    <h2 id="condicions"></h2>
                </div>
                <div>

                </div>
            </div>
            <div class="botons">

            </div>

        </div>

    </div>
</div>

<script src="app.js"></script>
</body>
</html>
