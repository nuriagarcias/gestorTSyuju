<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de la Pràctica</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<!--<div class="general">-->



<!--    <div class="card2">-->

<!--    </div>-->

<!--    &lt;!&ndash; Formulari d'entrada de dades &ndash;&gt;-->
<!--</div>-->

<!--grid!!!!!ª!-->
<div class="container">
    <div class="controls">
        <div class="inici">
            <div class="titol">
                <h1>Títol</h1>
            </div>
            <div class="generador">

                <div class="card2">
                    <h2>Generació de tamagochis</h2>
                    <div class="enunciats">
                    <div class="field">
                        <label for="iNom">Nombre:</label>
                        <input type="text" id="iNom" placeholder="Escribe el nombre de tu tamagochi">
                        <errorNom id="errorNom"></errorNom>
                    </div>

                    <div class="field">
                        <label for="iAparença">Apariencia:</label>
                        <select id="iAparença">
                            <option value="Opció 1">Opció 1</option>
                            <option value="Opció 2">Opció 2</option>
                            <option value="Opció 3">Opció 3</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="iEdat">Edad:</label>
                        <input type="number" id="iEdat" value="0">
                    </div>

                    <div class="field">
                        <label for="iPes">Peso (kg
                            ):</label>
                        <input type="number" id="iPes" value="0">
                    </div>

                    <div class="field-checkbox">
                        <label>
                            <input type="checkbox" id="iCondicions"> Acepta términos y condiciones para ser legal (ninguno)
                        </label>
                    </div>
                    </div>

                    <button id="btnAfegir">Afegir a la Llista</button>
                </div>
            </div>
        </div>
        <div class="organitzador">

            <div class="card1">
                <h1>Eines d'organització</h1>
                <div class="field">
                    <label for="iTema">Temes:</label>
                    <select id="iTema">
<!--                        <option value="Opció A">Opció 1</option>-->
<!--                        <option value="Opció B">Opció 2</option>-->
<!--                        <option value="Opció C">Opció 3</option>-->
                    </select>
                </div>
                <button onclick="ordenarNom()">Ordenar por orden alfabético</button>
                <div class="enunciats">

                    <div class="field">
                        <button onclick="ordenarEdatMajMen()">Ordenar por edad major a menor</button>
                        <button onclick="ordenarPesMajMen()">Ordenar por peso mayor a menor</button>
                    </div>
                    <div class="field">
                        <button onclick="ordenarEdatMenMaj()">Ordenar por edad menor a mayor</button>
                        <button onclick="ordenarPesMenMaj()">Ordenar por peso menor a mayor</button>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="tamagochis" id="contenidorAnimals">
        <div class="t1">
            <div class="info">
                <div>
                    <h1 id="nom"></h1>
                    <h2 id="aparença"></h2>
                    <h2 id="edat"></h2>
                    <h2 id="pes"></h2>
                    <h2 id="condicions"></h2>
                </div>
                <div>

                </div>
            </div>
            <div class="botons">

            </div>

        </div>

    </div>
</div>

<script src="app.js"></script>
</body>
</html>
